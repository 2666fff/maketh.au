<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f3f6f4">
  <link rel="icon" type="image/png" href="/assets/danatech/danatech-icon.png">
  <link rel="stylesheet" href="/assets/danatech/error.css">
  <title>Page not found | DanaTech</title>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-label="DanaTech home">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span>DanaTech</span>
      </a>
    </div>
  </header>
  <main>
    <div class="wrap error-layout">
      <p class="status-code" aria-hidden="true">404</p>
      <div class="error-copy">
        <p class="eyebrow">Page not found</p>
        <h1>This address does not lead to a page.</h1>
        <p class="message">The link may be outdated, or the page may have moved to a different section of the DanaTech website.</p>
        <nav class="error-actions" aria-label="Recovery links">
          <a class="primary" href="/">English home</a>
          <a href="/zh/" lang="zh-CN">中文首页</a>
          <a href="/games/little-tower-defence/">Little Tower Defence</a>
        </nav>
      </div>
    </div>
  </main>
</body>
</html>
