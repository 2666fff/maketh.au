<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f3f6f4">
  <link rel="icon" type="image/png" href="/assets/danatech/danatech-icon.png">
  <link rel="stylesheet" href="/assets/danatech/error.css">
  <title>Service temporarily unavailable | DanaTech</title>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/en/" aria-label="DanaTech home">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span>DanaTech</span>
      </a>
    </div>
  </header>
  <main>
    <div class="wrap error-layout">
      <p class="status-code" aria-hidden="true">502</p>
      <div class="error-copy">
        <p class="eyebrow">Temporary interruption</p>
        <h1>The website cannot complete this request right now.</h1>
        <p class="message">Please try the page again shortly. DanaTech company and game pages will return here as soon as the service is available.</p>
        <nav class="error-actions" aria-label="Recovery links">
          <a class="primary" href="/en/">Try English home</a>
          <a href="/zh/" lang="zh-CN">访问中文首页</a>
        </nav>
      </div>
    </div>
  </main>
</body>
</html>
