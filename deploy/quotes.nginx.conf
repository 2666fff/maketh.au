# Include in the maketh.au server block. PHP 8.4 FPM is managed by the existing panel.
location = /api/quotes.php {
    client_max_body_size 16k;
    try_files $uri =404;
    include fastcgi.conf;
    fastcgi_pass unix:/tmp/php-cgi-84.sock;
    fastcgi_param PHP_ADMIN_VALUE "open_basedir=/www/wwwroot/maketh.au/:/etc/maketh-quotes/:/var/lib/maketh-quotes/:/tmp/\ndisplay_errors=Off";
}
location ^~ /scripts/ { return 404; }
location ^~ /deploy/ { return 404; }
location ^~ /tests/ { return 404; }
location ^~ /.codex_tmp/ { return 404; }
location = /confs.txt { return 404; }
location = /codex_temp.txt { return 404; }
location = /maketh.au_key { return 404; }
