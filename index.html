<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#111b19">
  <link rel="canonical" href="https://maketh.au/">
  <link rel="alternate" hreflang="en-AU" href="https://maketh.au/en/">
  <link rel="alternate" hreflang="zh-CN" href="https://maketh.au/zh/">
  <link rel="alternate" hreflang="x-default" href="https://maketh.au/">
  <link rel="icon" type="image/png" href="/assets/danatech/danatech-icon.png">
  <title>DanaTech</title>
  <script>
    const languages = navigator.languages || [navigator.language || 'en'];
    const destination = languages.some((language) => /^zh\b/i.test(language)) ? '/zh/' : '/en/';
    window.location.replace(destination);
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/en/"></noscript>
</head>
<body>
  <nav aria-label="Language">
    <a href="/en/" lang="en-AU">English</a>
    <a href="/zh/" lang="zh-CN">中文</a>
  </nav>
</body>
</html>
